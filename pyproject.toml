[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saa-martin-baseline"
version = "0.1.0"
license = {file = "LICENSE"}
readme = "README.md"
description = "Frozen retrospective annotation-reproduction baseline; code only"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0", "matplotlib==3.10.8", "joblib==1.5.3"]

[tool.setuptools.packages.find]
where = ["src"]
